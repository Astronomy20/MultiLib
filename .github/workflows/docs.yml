name: Docs

on:
  push:
    branches: [1.21.1]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ./gradlew publish only ever adds the current mod_version's files (see build.gradle's
      # `publishing` block, writing into ./repo) - it never touches other versions' directories. To
      # keep every version that's ever been published (not just whatever the last deploy happened to
      # produce), `repo/` is a checkout of a dedicated `maven-repo` branch that accumulates history
      # across runs, committed back below. Falls back to an empty repo on the very first run, when
      # that branch doesn't exist yet.
      - name: Check out accumulated Maven repo (maven-repo branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --branch maven-repo --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo \
            || (mkdir -p repo && cd repo && git init -q -b maven-repo \
                && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git")

      # Whether this push is the first one seen with the current mod_version: if the bare <mod_version>
      # directory doesn't already exist in the accumulated repo, this run also publishes the immutable
      # "real release" version (see build.gradle's `publishing` block) - once cut, it's never touched
      # again by a later push that hasn't bumped mod_version yet.
      - name: Determine which Maven publications to run
        id: maven_targets
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          RELEASE_DIR="repo/net/astronomy/multilib/multilib/${MOD_VERSION}"
          if [ -d "$RELEASE_DIR" ]; then
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Publishes to ./repo (see build.gradle's `publishing` block) on every push to 1.21.1, not just
      # tagged CurseForge/Modrinth releases - a downstream mod embedding MultiLib via jarJar can track
      # the latest commit without waiting for a player-facing release. See wiki/Maven-Releases.md for
      # what each of the three published versions (SNAPSHOT / build number / bare release) means.
      - name: Publish Maven artifacts
        env:
          MULTILIB_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          TASKS="publishMavenSnapshotPublicationToLocalRepository publishMavenBuildPublicationToLocalRepository"
          if [ "${{ steps.maven_targets.outputs.publish_release }}" = "true" ]; then
            TASKS="$TASKS publishMavenReleasePublicationToLocalRepository"
          fi
          ./gradlew $TASKS

      - name: Commit and push accumulated Maven repo
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Publish ${{ github.sha }}"
          git push -q origin HEAD:maven-repo

      # Generates wiki/Maven-Versions.md from the accumulated repo/ (every version directory found
      # under the multilib artifact path), so the docs site lists every version ever published, not
      # just the current one - see wiki/Maven-Versions.md's committed placeholder for the local-build
      # fallback when this step hasn't run.
      - name: Generate Maven version index
        run: |
          VERSIONS_DIR="repo/net/astronomy/multilib/multilib"
          BASE_URL="https://astronomy20.github.io/MultiLib/maven/net/astronomy/multilib/multilib"
          {
            echo "[← Back to Home](index.md)"
            echo
            echo "# Maven Version Index"
            echo
            echo "Every version of \`net.astronomy.multilib:multilib\` published to the [hosted Maven repository](Maven-Releases.md), newest first."
            echo
            echo "| Version | Type | Jar | Sources | POM |"
            echo "|---|---|---|---|---|"
            if [ -d "$VERSIONS_DIR" ]; then
              for v in $(ls -1 "$VERSIONS_DIR" | sort -rV); do
                dir="$VERSIONS_DIR/$v"
                [ -d "$dir" ] || continue
                case "$v" in
                  *-SNAPSHOT) type="Snapshot (latest, mutable)" ;;
                  *-*) type="Build (immutable pin)" ;;
                  *) type="**Release**" ;;
                esac
                jar_link="—"; [ -f "$dir/multilib-$v.jar" ] && jar_link="[jar]($BASE_URL/$v/multilib-$v.jar)"
                src_link="—"; [ -f "$dir/multilib-$v-sources.jar" ] && src_link="[sources]($BASE_URL/$v/multilib-$v-sources.jar)"
                pom_link="—"; [ -f "$dir/multilib-$v.pom" ] && pom_link="[pom]($BASE_URL/$v/multilib-$v.pom)"
                echo "| \`$v\` | $type | $jar_link | $src_link | $pom_link |"
              done
            fi
          } > wiki/Maven-Versions.md

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Generate homepage from README
        run: |
          sed \
            -e 's#\](\.\./\.\./wiki/api-reference/Multiblock-States-And-Progress)#](api-reference/Multiblock-States-And-Progress.md)#' \
            -e 's#\](\.\./\.\./wiki/Advanced-Features#\](Advanced-Features.md#' \
            -e 's|](/wiki/index#7-api-reference)|](api-reference/MultiLib.md)|' \
            -e 's#\](wiki/index\.md)#](index.md)#' \
            -e 's#\](wiki/Getting-Started)#](Getting-Started.md)#' \
            -e 's#\](wiki/Core-Concepts)#](Core-Concepts.md)#' \
            -e 's#\](wiki/Pattern-Design-Guide)#](Pattern-Design-Guide.md)#' \
            -e 's#\](wiki/Rotation-And-Matching)#](Rotation-And-Matching.md)#' \
            -e 's#\](wiki/Advanced-Features)#](Advanced-Features.md)#' \
            -e 's#\](wiki/FAQ-Troubleshooting)#](FAQ-Troubleshooting.md)#' \
            README.md > wiki/index.md

      - name: Build site
        run: mkdocs build -f wiki/mkdocs.yml --strict

      # Merged into the same Pages deployment as the docs (one artifact per deploy - see
      # wiki/Maven-Releases.md for the resulting URL and consumer-side Gradle snippet).
      - name: Add Maven repository to site
        run: |
          mkdir -p site/maven
          rsync -a --exclude='.git' repo/ site/maven/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
